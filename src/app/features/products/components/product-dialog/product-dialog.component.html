<h2 mat-dialog-title>{{ isEdit ? 'Editar producto' : 'Crear producto' }}</h2>

<mat-dialog-content class="product-dialog__content">
  <form [formGroup]="form" class="product-form" (ngSubmit)="save()">
    <mat-form-field appearance="fill" class="product-form__field">
      <mat-label>Título</mat-label>
      <input matInput formControlName="title" />
      <mat-error *ngIf="form.get('title')?.hasError('required')">Requerido</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" class="product-form__field">
      <mat-label>Precio</mat-label>
      <input matInput type="number" formControlName="price" />
      <mat-error *ngIf="form.get('price')?.hasError('min')">Precio inválido</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" class="product-form__field">
      <mat-label>Categoría</mat-label>
      <input matInput formControlName="category" />
    </mat-form-field>

    <mat-form-field appearance="fill" class="product-form__field">
      <mat-label>Imagen (URL)</mat-label>
      <input matInput formControlName="image" />
    </mat-form-field>

    <mat-form-field appearance="fill" class="product-form__field">
      <mat-label>Descripción</mat-label>
      <textarea matInput rows="4" formControlName="description"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="close()">Cancelar</button>
  <button mat-flat-button color="primary" (click)="save()">
    {{ isEdit ? 'Actualizar' : 'Crear' }}
  </button>
</mat-dialog-actions>
